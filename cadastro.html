    <main>
    <h2>Cadastrar Espécime no Herbário</h2>

    <form id="formCadastro" class="card-form">

        <label>Nome Popular</label>
        <input type="text" id="nomePopular" placeholder="Ex: Ipê Roxo">

        <label>Nome Científico</label>
        <input type="text" id="nomeCientifico" placeholder="Ex: Handroanthus impetiginosus">

        <label>Família</label>
        <input type="text" id="familia">

        <label>Gênero</label>
        <input type="text" id="genero">

        <label>Espécie</label>
        <input type="text" id="especie">

        <label>Local de Coleta</label>
        <input type="text" id="local">

        <label>Data de Coleta</label>
        <input type="date" id="data">

        <label>Coletor</label>
        <input type="text" id="coletor">

        <label>Imagem (URL)</label>
        <input type="text" id="imagem" placeholder="Cole o link da imagem">

        <div class="botoes">
            <button type="submit">Salvar Espécime</button>
            <button type="reset">Limpar</button>
        </div>

        <p id="msg"></p>

    </form>
</main>

    <footer>
        <p>&copy; 2026 Freesia - Herbário Virtual</p>
    </footer>
    <script src="./ScriptJS/cadastro.js"></script>
</body>
