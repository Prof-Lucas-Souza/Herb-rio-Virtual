<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="icon" type="image/png" href="../IMG/faviconfreesiaroxo.png">
        <meta charset="UTF-8">
        <title>Consulta - Freesia</title>
        <link rel="stylesheet" href="../ScriptCSS/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Gwendolyn&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre o Projeto</a>
                <a href="consultapublica.html">Consulta Pública</a>
                <a href="cadastro.html">Cadastro de Coleta</a>
            </nav>
            <h1>Freesia</h1>
        </header>
        <main>
            <h2>Consulta Pública do Herbário Virtual</h2>
            <form id="formPesquisa" method="get">
                <label for="busca">Digite o nome da espécie:</label><br>
                <input type="text" id="busca" name="busca" placeholder="Ex: Freesia refracta"><br><br>
                <fieldset>
                    <legend>Filtros de pesquisa</legend>
                    <label><input type="checkbox" name="duplicatas"> Mostrar Duplicatas</label><br>
                    <label><input type="checkbox" name="indeterminados"> Espécimes Indeterminados</label><br>
                    <label><input type="checkbox" name="imagens"> Apenas com Imagens</label><br>
                    <label><input type="checkbox" name="coordenada"> Apenas com Coordenada</label>
                </fieldset><br>
                <label for="quantidade">Espécimes por página:</label>
                <select id="quantidade" name="quantidade">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select><br><br>
                <button type="submit">Consultar</button>
                <button type="reset">Limpar</button>
            </form>
            <div id="resultado"></div>
        </main>
        <footer>
            <p>&copy; 2026 Freesia - Herbário Virtual</p>
        </footer>
        <script src="../ScriptJS/consulta.js"></script>
    </body>
</html>
